name: B217 validation tools
on:
  push:
    branches: [audit/b217-source-baseline-20260930]
    paths: [.github/workflows/b217-validation-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch existing stable audit tool versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          sha256sum /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm.zip > /tmp/acme-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: acme-b217-validation-tools
          path: /tmp/acme-tools/
          retention-days: 3
          compression-level: 0
