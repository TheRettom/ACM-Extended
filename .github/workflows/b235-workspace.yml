name: B235 pinned workspace
on:
  push:
    branches: [build/b235-workspace-20261004]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b4b10343919b43d4a257112835292f5f2821743
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact B234 source and pinned tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6b4b10343919b43d4a257112835292f5f2821743
          mkdir -p /tmp/b235-workspace
          git branch b234-workspace HEAD
          git bundle create /tmp/b235-workspace/B234-full.bundle b234-workspace
          git bundle verify /tmp/b235-workspace/B234-full.bundle
          curl -fLsS --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/b235-workspace/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/b235-workspace/hemtt' | sha256sum --check
          curl -fLsS --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/b235-workspace/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/b235-workspace/sqfvm.zip' | sha256sum --check
          cd /tmp/b235-workspace
          sha256sum B234-full.bundle hemtt sqfvm.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: b235-pinned-workspace
          path: /tmp/b235-workspace/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
